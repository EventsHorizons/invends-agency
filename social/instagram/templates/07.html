<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    h1 {
      font-size: 68px;
      max-width: 12ch;
      margin: 20px 0 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      flex: 1;
      margin-bottom: 130px;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      padding: 40px 36px;
      border: 1px solid var(--line);
      min-height: 720px;
    }
    .col.inv {
      background: color-mix(in srgb, var(--brand-deep) 55%, var(--surface));
      border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
    }
    .col h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 40px;
    }
    .col.inv h2 { color: var(--lavender); }
    .item {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      padding: 28px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      line-height: 1.25;
    }
    .col.inv .item {
      color: var(--fg);
      border-top-color: color-mix(in srgb, var(--brand) 30%, var(--line));
    }
    .item:last-child { border-bottom: 1px solid var(--line); }
    .col.inv .item:last-child {
      border-bottom-color: color-mix(in srgb, var(--brand) 30%, var(--line));
    }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow">Comparación</p>
    <h1 class="display">Genérico vs. <em>criterio</em>.</h1>
    <div class="grid">
      <div class="col">
        <h2>Ruido</h2>
        <div class="item">Promesas abiertas</div>
        <div class="item">Propuestas plantilla</div>
        <div class="item">Diseño sin brief</div>
        <div class="item">Métricas sin decisión</div>
      </div>
      <div class="col inv">
        <h2>Invends</h2>
        <div class="item">Alcance concreto</div>
        <div class="item">Conversación útil</div>
        <div class="item">Oficio con objetivo</div>
        <div class="item">Siguiente paso claro</div>
      </div>
    </div>
    <span class="mark bl">Invends</span>
  </div>
</body>
</html>
