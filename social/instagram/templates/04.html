<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas { background: var(--bg); display: flex; flex-direction: column; }
    h1 { font-size: 68px; max-width: 11ch; margin: 20px 0 48px; }
    .steps { display: grid; gap: 20px; flex: 1; }
    .step {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 32px 36px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 20px;
      align-items: center;
      min-height: 160px;
    }
    .step .n {
      font-size: 48px;
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.04em;
    }
    .step h2 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
    .step p { font-size: 26px; color: var(--muted); line-height: 1.3; }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow">Desarrollo</p>
    <h1 class="display">Que se sostenga el día que llega gente.</h1>
    <div class="steps">
      <div class="step"><div class="n">01</div><div><h2>Base</h2><p>Arquitectura · Contenido · Despliegue</p></div></div>
      <div class="step"><div class="n">02</div><div><h2>Rendimiento</h2><p>Peso · Render · Accesibilidad</p></div></div>
      <div class="step"><div class="n">03</div><div><h2>Evolución</h2><p>Integraciones · Cambios sin drama</p></div></div>
    </div>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
