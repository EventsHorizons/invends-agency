<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .intro { margin-bottom: 56px; }
    h1 {
      font-size: 68px;
      max-width: 11ch;
      margin: 20px 0 0;
    }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 0;
      flex: 1;
      margin-bottom: 120px;
    }
    .step {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 32px;
      align-items: start;
      padding: 36px 0;
      border-top: 1px solid var(--line);
    }
    .step:last-child { border-bottom: 1px solid var(--line); }
    .idx {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--brand);
      line-height: 1;
    }
    .step h2 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .step p {
      font-size: 28px;
      color: var(--muted);
      line-height: 1.3;
      max-width: 18ch;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="intro">
      <p class="num">02 · Desarrollo</p>
      <h1 class="display">Base → rendimiento → <em>evolución</em>.</h1>
    </div>
    <div class="steps">
      <div class="step">
        <span class="idx">01</span>
        <div>
          <h2>Base</h2>
          <p>Arquitectura, contenido, despliegue.</p>
        </div>
      </div>
      <div class="step">
        <span class="idx">02</span>
        <div>
          <h2>Rendimiento</h2>
          <p>Peso, render, accesibilidad.</p>
        </div>
      </div>
      <div class="step">
        <span class="idx">03</span>
        <div>
          <h2>Evolución</h2>
          <p>Integraciones sin reescribirlo todo.</p>
        </div>
      </div>
    </div>
    <span class="mark bl">Invends</span>
  </div>
</body>
</html>
