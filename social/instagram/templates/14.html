<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      background:
        radial-gradient(ellipse 80% 55% at 50% 0%, rgba(138, 104, 255, 0.22), transparent 60%),
        var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 120px;
    }
    h1 {
      font-size: 92px;
      max-width: 10ch;
      margin-bottom: 36px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      min-height: 72px;
      padding: 0 36px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 48px;
      width: fit-content;
    }
    .meta {
      font-size: 26px;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow" style="margin-bottom: 24px">Cierre de semana</p>
    <h1 class="display">Hablemos de tu <em>proyecto</em>.</h1>
    <div class="cta">Hablar con Invends</div>
    <p class="meta">Bogotá / LATAM<br />hola@invends.com</p>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
