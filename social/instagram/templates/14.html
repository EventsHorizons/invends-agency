<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background:
        radial-gradient(ellipse 90% 55% at 20% 0%, rgba(138, 104, 255, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 80%, rgba(255, 45, 170, 0.1), transparent 50%),
        var(--bg);
    }
    .eyebrow { margin-bottom: 28px; }
    h1 {
      font-size: 100px;
      max-width: 9ch;
      margin-bottom: 48px;
    }
    .cta-block {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 160px;
      max-width: 520px;
    }
    .cta {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
      padding: 28px 36px;
      background: var(--fg);
      color: var(--bg);
      text-align: center;
    }
    .mail {
      font-size: 30px;
      font-weight: 600;
      color: var(--lavender);
      letter-spacing: -0.01em;
    }
    .loc {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow">Cierre · Semana 01</p>
    <h1 class="display">Hablemos de tu <em>proyecto</em>.</h1>
    <div class="cta-block">
      <div class="cta">Hablar con Invends</div>
      <p class="mail">hola@invends.com</p>
      <p class="loc">Bogotá / LATAM</p>
    </div>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
