<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas { background: var(--bg); display: flex; flex-direction: column; }
    h1 { font-size: 64px; max-width: 12ch; margin: 18px 0 40px; }
    .flow {
      flex: 1;
      position: relative;
      border: 1px solid var(--line);
      background: var(--surface);
      margin-bottom: 100px;
      min-height: 640px;
    }
    .node {
      position: absolute;
      width: 160px;
      height: 160px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      padding: 12px;
    }
    .node.on {
      border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
      color: var(--fg);
      background: color-mix(in srgb, var(--brand) 16%, var(--surface-2));
    }
    .n1 { left: 48px; top: 80px; }
    .n2 { left: 340px; top: 240px; }
    .n3 { right: 48px; top: 160px; }
    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    path {
      fill: none;
      stroke: color-mix(in srgb, var(--brand) 50%, transparent);
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="num">Automatización · IA</p>
    <h1 class="display">Ampliar el trabajo sin perder el <em>criterio</em>.</h1>
    <div class="flow" aria-hidden="true">
      <svg viewBox="0 0 900 640" preserveAspectRatio="none">
        <path d="M210 160 H340 V320 H420" />
        <path d="M500 320 H680 V240" />
      </svg>
      <div class="node n1">Caso</div>
      <div class="node n2 on">Flujo</div>
      <div class="node n3">Decisión</div>
    </div>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
