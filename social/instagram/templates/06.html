<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      padding-bottom: 140px;
      background: var(--bg);
    }
    .eyebrow { margin-bottom: 20px; }
    h1 {
      font-size: 56px;
      max-width: 14ch;
      margin-bottom: 48px;
    }
    .stack {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0;
    }
    .row {
      flex: 1;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 28px;
      align-items: center;
      border-top: 1px solid var(--line);
      min-height: 220px;
    }
    .row:last-child { border-bottom: 1px solid var(--line); }
    .n {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--brand);
      line-height: 1;
    }
    .row h2 {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin-bottom: 10px;
    }
    .row p {
      font-size: 28px;
      color: var(--muted);
      line-height: 1.3;
      max-width: 22ch;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow">Método</p>
    <h1 class="display">Cómo trabajamos.</h1>
    <div class="stack">
      <div class="row">
        <span class="n">01</span>
        <div>
          <h2>Claridad</h2>
          <p>Objetivo comercial y brief antes de diseñar o desarrollar.</p>
        </div>
      </div>
      <div class="row">
        <span class="n">02</span>
        <div>
          <h2>Oficio</h2>
          <p>Cada pieza con criterio de uso — tipografía, código o campaña.</p>
        </div>
      </div>
      <div class="row">
        <span class="n">03</span>
        <div>
          <h2>Alcance</h2>
          <p>Qué entra, qué queda fuera, cómo se mide el siguiente paso.</p>
        </div>
      </div>
    </div>
    <span class="mark bl">Invends</span>
  </div>
</body>
</html>
