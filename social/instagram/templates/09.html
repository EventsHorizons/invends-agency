<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg);
    }
    .ui {
      margin-top: 80px;
      width: 100%;
      height: 520px;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 40px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 28px;
    }
    .bar {
      height: 12px;
      width: 40%;
      background: var(--ink-soft, #332a49);
      background: color-mix(in srgb, var(--fg) 18%, transparent);
    }
    .bar.short { width: 24%; }
    .focus {
      height: 56px;
      width: 55%;
      border: 2px solid var(--brand);
      background: color-mix(in srgb, var(--brand) 10%, transparent);
    }
    .rows {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }
    .rows i {
      display: block;
      height: 14px;
      background: color-mix(in srgb, var(--fg) 12%, transparent);
      width: 70%;
    }
    .rows i:nth-child(2) { width: 55%; }
    .rows i:nth-child(3) { width: 62%; }
    .cta-line {
      height: 48px;
      width: 180px;
      background: color-mix(in srgb, var(--brand) 35%, transparent);
    }
    .copy { margin-bottom: 100px; }
    h1 {
      font-size: 72px;
      max-width: 10ch;
      margin: 16px 0 24px;
    }
    .body { max-width: 18ch; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="ui" aria-hidden="true">
      <div class="bar"></div>
      <div class="focus"></div>
      <div class="rows"><i></i><i></i><i></i></div>
      <div class="cta-line"></div>
    </div>
    <div class="copy">
      <p class="eyebrow">Experiencia</p>
      <h1 class="display">UX que se <em>sostiene</em>.</h1>
      <p class="body">Estados claros. Foco visible. Una acción evidente.</p>
    </div>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
