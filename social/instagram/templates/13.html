<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      padding: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      background: #090711;
    }
    .media {
      position: relative;
      background:
        #100a1c
        url("../../../public/images/principle-diseno.webp")
        center 40% / cover no-repeat;
      min-height: 920px;
    }
    .media::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(9, 7, 17, 0.2) 0%,
        rgba(9, 7, 17, 0.05) 40%,
        rgba(9, 7, 17, 0.85) 100%
      );
    }
    .bar {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 48px var(--safe) 140px;
      background: var(--bg);
      border-top: 1px solid var(--line);
    }
    .bar .eyebrow { color: var(--brand); }
    h1 {
      font-size: 56px;
      max-width: 14ch;
      letter-spacing: -0.04em;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="media" role="img" aria-label="Muestra de método Invends"></div>
    <div class="bar">
      <p class="eyebrow">Muestras</p>
      <h1 class="display">Ideas → <em>experiencias</em>.</h1>
    </div>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
