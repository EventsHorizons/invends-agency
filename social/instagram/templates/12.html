<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas.light {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--bg-light);
    }
    .bar {
      width: 72px;
      height: 8px;
      background: var(--brand);
      margin-bottom: 36px;
    }
    h1 {
      font-size: 72px;
      color: var(--fg-light);
      max-width: 12ch;
      margin-bottom: 28px;
    }
    .mail {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--brand);
      margin-top: 48px;
    }
    .foot {
      font-size: 28px;
      font-weight: 800;
      color: var(--fg-light);
    }
  </style>
</head>
<body>
  <div class="canvas light">
    <div>
      <p class="eyebrow" style="margin-top: 24px">Contacto</p>
      <div class="bar"></div>
      <h1 class="display">Cuéntanos el objetivo.</h1>
      <p class="body">Respondemos con alcance claro. Sin propuestas genéricas.</p>
      <p class="mail">hola@invends.com</p>
    </div>
    <p class="foot">Invends</p>
  </div>
</body>
</html>
