<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas.light {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(165deg, #ffffff 0%, #f7f6fb 55%, #efedf8 100%);
    }
    .brand-lock {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--fg-light);
    }
    .mid { margin-top: 120px; }
    h1 {
      font-size: 84px;
      max-width: 10ch;
      margin: 28px 0 40px;
      color: var(--fg-light);
    }
    .mail {
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--brand);
      margin-bottom: 24px;
    }
    .body {
      max-width: 20ch;
      color: var(--muted-light);
    }
    .footer-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 8px;
    }
    .footer-meta .loc {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-light);
    }
  </style>
</head>
<body>
  <div class="canvas light">
    <p class="brand-lock">Invends</p>
    <div class="mid">
      <p class="eyebrow">Contacto</p>
      <h1 class="display">Cuéntanos el <em>objetivo</em>.</h1>
      <p class="mail">hola@invends.com</p>
      <p class="body">Respondemos con alcance claro. Sin propuestas genéricas.</p>
    </div>
    <div class="footer-meta">
      <p class="loc">Bogotá / LATAM</p>
    </div>
  </div>
</body>
</html>
