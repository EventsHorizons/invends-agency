<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background:
        radial-gradient(ellipse 100% 70% at 85% -5%, rgba(138, 104, 255, 0.35), transparent 52%),
        radial-gradient(ellipse 60% 45% at 0% 100%, rgba(37, 19, 79, 0.9), transparent 55%),
        var(--bg);
    }
    .top-meta {
      position: absolute;
      top: var(--safe);
      left: var(--safe);
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .top-meta .dot {
      width: 10px;
      height: 10px;
      background: var(--magenta);
    }
    h1 {
      font-size: 124px;
      max-width: 8.5ch;
      margin: 0 0 40px;
    }
    .tag {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 140px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top-meta">
      <span class="dot" aria-hidden="true"></span>
      <p class="eyebrow">Semana 01 · Invends</p>
    </div>
    <h1 class="display">Presencia que <em>decide</em>.</h1>
    <p class="tag">Diseño · Código · Mensaje</p>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
