<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background:
        radial-gradient(ellipse 90% 60% at 80% 10%, rgba(138, 104, 255, 0.28), transparent 55%),
        radial-gradient(ellipse 70% 50% at 10% 90%, rgba(255, 45, 170, 0.12), transparent 50%),
        var(--bg);
    }
    h1 {
      font-size: 118px;
      max-width: 9.5ch;
      margin-bottom: 36px;
    }
    .tag {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 120px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <p class="eyebrow" style="margin-bottom: 28px">Campaña semanal</p>
    <h1 class="display">Presencia que <em>decide</em>.</h1>
    <p class="tag">Diseño · Código · Mensaje</p>
    <span class="mark br">Invends</span>
  </div>
</body>
</html>
