<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas { background: var(--bg); }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 40px;
      height: 100%;
      align-items: end;
      padding-bottom: 80px;
    }
    .left { align-self: start; padding-top: 40px; }
    h1 {
      font-size: 78px;
      max-width: 8ch;
    }
    .rail {
      border-left: 2px solid var(--line);
      padding-left: 36px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      justify-content: flex-end;
      min-height: 70%;
    }
    .rail p {
      font-size: 32px;
      line-height: 1.3;
      color: var(--muted);
    }
    .rail strong {
      color: var(--fg);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="grid">
      <div class="left">
        <p class="eyebrow" style="margin-bottom: 24px">Posicionamiento</p>
        <div class="accent-bar" style="margin-bottom: 28px"></div>
        <h1 class="display">Claridad <em>antes</em> que ruido.</h1>
      </div>
      <div class="rail">
        <p>Menos promesas abiertas.</p>
        <p><strong>Más alcance concreto.</strong></p>
        <p>Que la marca se entienda, se sostenga y se elija.</p>
      </div>
    </div>
    <span class="mark bl">Invends</span>
  </div>
</body>
</html>
