<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .canvas {
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--bg);
    }
    .rail {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 12px;
      background: linear-gradient(180deg, var(--brand) 0%, var(--brand-deep) 100%);
    }
    .head {
      padding-left: 28px;
      margin-top: 40px;
    }
    h1 {
      font-size: 96px;
      max-width: 9ch;
      margin: 28px 0 0;
      padding-left: 28px;
    }
    .aside {
      align-self: end;
      justify-self: end;
      max-width: 340px;
      text-align: right;
      margin-bottom: 160px;
    }
    .aside p {
      font-size: 32px;
      line-height: 1.35;
      color: var(--muted);
    }
    .aside .rule {
      margin-left: auto;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="rail" aria-hidden="true"></div>
    <div class="head">
      <p class="eyebrow">Posicionamiento</p>
    </div>
    <h1 class="display">Claridad antes que <em>ruido</em>.</h1>
    <div class="aside">
      <hr class="rule" />
      <p>Menos promesas abiertas. Más alcance concreto.</p>
    </div>
    <span class="mark bl">Invends</span>
  </div>
</body>
</html>
