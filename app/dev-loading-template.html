    <title data-app-name="Invends">{{LOADING}} | Invends</title>
    <style>
      :root {
        --bg: #090711;
        --fg: #f7f5ff;
        --brand: #8a68ff;
        --brand-soft: color-mix(in srgb, #8a68ff 35%, transparent);
        --muted: color-mix(in srgb, #f7f5ff 48%, transparent);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        background:
          radial-gradient(
            48% 42% at 50% 38%,
            var(--brand-soft),
            transparent 70%
          ),
          radial-gradient(
            36% 30% at 78% 72%,
            color-mix(in srgb, #25134f 55%, transparent),
            transparent 75%
          );
        pointer-events: none;
      }
      .lockup {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 1.1rem;
        justify-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      .mark {
        width: min(42vw, 11.5rem);
        height: auto;
        color: var(--fg);
        opacity: 0.96;
      }
      .hint {
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .nuxt-loader-bar {
        position: fixed;
        z-index: 2;
        left: 0;
        right: auto;
        bottom: 0;
        height: 2px;
        width: var(--nuxt-progress, 4%);
        background: var(--brand);
        transition: width 0.3s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        body::before {
          background: none;
        }
      }
    </style>

    <div class="nuxt-loader-bar" aria-hidden="true"></div>
    <script>
      if (!window.frameElement) {
        if (void 0 === window.fetch) setTimeout(() => window.location.reload(), 200);
        else {
          let t = 200;
          const e = async () => {
            try {
              if (
                !(
                  await window
                    .fetch(window.location.href, {
                      headers: { accept: "text/html" },
                    })
                    .then((r) => r.text())
                ).includes("__NUXT_LOADING__")
              )
                return window.location.reload();
            } catch {}
            setTimeout(e, t);
            t = Math.min(Math.round(1.5 * t), 1000);
          };
          e();
        }
      }
    </script>
